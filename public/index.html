<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cloudflare-free-ai-pi</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --panel:#131a22; --line:#1f2933; --text:#e6edf3; --dim:#8b98a5; --acc:#4cc2ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header b { font-size:15px; }
  .chip { font-size:12px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .chip.ok { color:var(--ok); border-color:#1d4428; }
  .chip.warn { color:var(--warn); border-color:#4d3a12; }
  .chip.err { color:var(--err); border-color:#5a2326; }
  button { background:#1c2733; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--acc); }
  button:disabled { opacity:.5; cursor:default; }
  main { flex:1; overflow-y:auto; padding:16px 16px 8px; display:flex; flex-direction:column; gap:10px; max-width:860px; width:100%; margin:0 auto; }
  .msg { max-width:85%; padding:8px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#1f3a5f; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .tool { align-self:flex-start; max-width:95%; font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--dim); border:1px dashed var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; }
  .tool pre { margin:6px 0 0; color:var(--text); max-height:220px; overflow:auto; white-space:pre-wrap; }
  .notice { align-self:center; color:var(--dim); font-size:12px; }
  footer { padding:12px 16px 16px; border-top:1px solid var(--line); background:var(--panel); }
  .row { max-width:860px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; background:#0d141b; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; resize:none; height:44px; }
  textarea:focus { outline:none; border-color:var(--acc); }
  details.raw { color:var(--dim); font-size:11px; align-self:stretch; }
  details.raw pre { white-space:pre-wrap; word-break:break-all; max-height:300px; overflow:auto; }
</style>
</head>
<body>
<header>
  <b>☁️ cloudflare-free-ai-pi</b>
  <span id="model" class="chip">model: …</span>
  <span id="kb" class="chip">AI Search: …</span>
  <span style="flex:1"></span>
  <button id="setup" title="创建 AI Search 实例并上传示例文档（幂等）">1️⃣ 初始化知识库</button>
  <button id="transcript">查看转录</button>
  <button id="reset">重置会话</button>
</header>
<main id="log">
  <div class="notice">验收三连：①「知识库里的暗号是什么？」→ 必须调 ai_search 才能答 ②「现在几点（UTC）？」→ now 工具 ③ 任意闲聊 → 直答。先点右上角「初始化知识库」。</div>
</main>
<footer>
  <div class="row">
    <textarea id="input" placeholder="问点什么…（Enter 发送）"></textarea>
    <button id="send" style="align-self:flex-end">发送</button>
  </div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let busy = false;

function bubble(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function toolLine(name, args, result) {
  const el = document.createElement("details");
  el.className = "tool";
  const s = document.createElement("summary");
  s.textContent = "🔧 " + name + "(" + JSON.stringify(args ?? {}).slice(0, 80) + ")";
  const pre = document.createElement("pre");
  pre.textContent = typeof result === "string" ? result.slice(0, 4000) : JSON.stringify(result, null, 2).slice(0, 4000);
  el.appendChild(s); el.appendChild(pre);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function notice(text) {
  const el = document.createElement("div");
  el.className = "notice"; el.textContent = text;
  log.appendChild(el); log.scrollTop = log.scrollHeight;
}

// entry → display units
function renderEntries(entries) {
  if (!Array.isArray(entries)) return;
  for (const e of entries) {
    const kind = String(e?.kind ?? "");
    if (kind.includes("user")) {
      const t = (e?.content ?? []).map(p => p?.text ?? "").join("");
      if (t) bubble("user", t);
    } else if (kind.includes("assistant")) {
      const t = (e?.content ?? []).map(p => p?.text ?? "").join("");
      if (t) bubble("bot", t);
    } else if (kind.includes("tool")) {
      toolLine(e?.toolName ?? e?.name ?? "tool", e?.args, e?.result ?? e?.output);
    } else {
      const el = document.createElement("details");
      el.className = "raw";
      const s = document.createElement("summary"); s.textContent = "· " + (kind || "entry");
      const pre = document.createElement("pre"); pre.textContent = JSON.stringify(e, null, 2).slice(0, 2000);
      el.appendChild(s); el.appendChild(pre); log.appendChild(el);
    }
  }
  log.scrollTop = log.scrollHeight;
}

async function refreshStatus() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("model").textContent = "model: " + h.model;
    const s = await (await fetch("/api/status")).json();
    const status = s?.kb?.status ?? s?.kb?.error ?? "unknown";
    const chip = $("kb");
    chip.textContent = "AI Search: " + status;
    chip.className = "chip " + (/error|not found|not exist/i.test(String(status)) ? "err" : /ready|indexed|complete/i.test(String(status)) ? "ok" : "warn");
  } catch { $("model").textContent = "model: ?"; $("kb").textContent = "AI Search: ?"; }
}

async function loadTranscript(silent) {
  try {
    const entries = await (await fetch("/api/messages")).json();
    if (!silent) { log.innerHTML = ""; }
    renderEntries(entries);
    if (!silent && !Array.isArray(entries)) notice("（转录为空或尚无会话）");
  } catch (e) { if (!silent) notice("读取转录失败：" + e.message); }
}

$("setup").onclick = async () => {
  $("setup").disabled = true;
  notice("初始化知识库…（建实例 + 传 3 份文档）");
  try {
    const r = await (await fetch("/api/setup", { method: "POST" })).json();
    notice("setup: " + JSON.stringify(r));
    refreshStatus();
  } catch (e) { notice("setup 失败：" + e.message); }
  $("setup").disabled = false;
};
$("transcript").onclick = () => loadTranscript(false);
$("reset").onclick = async () => {
  await fetch("/api/reset", { method: "POST" });
  log.innerHTML = ""; notice("会话已重置。");
};

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true;
  input.value = "";
  bubble("user", text);
  const pending = bubble("bot", "…");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message: text }) });
    const data = await r.json();
    pending.textContent = data.text ?? ("错误: " + JSON.stringify(data));
  } catch (e) {
    pending.textContent = "请求失败: " + e.message;
  }
  busy = false; $("send").disabled = false;
  loadTranscript(true); // pull tool-call trail quietly
  log.scrollTop = log.scrollHeight;
}
$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

refreshStatus();
</script>
</body>
</html>
